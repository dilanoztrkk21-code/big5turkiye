<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Big5 Türkiye Ranker</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#333;font-family:Arial,Helvetica,sans-serif}main{max-width:850px;margin:0 auto;padding:14px}.banner{height:74px;background:linear-gradient(115deg,#171c70,#6731b7 55%,#f05dbd);display:flex;align-items:center;justify-content:center;color:white;text-align:center;margin:0 0 26px;letter-spacing:2px;font-weight:800}.banner span{display:block;font-size:12px;letter-spacing:1px;font-weight:500}.podium{display:grid;grid-template-columns:repeat(6,1fr);gap:22px 12px;max-width:680px;margin:0 auto 26px}.slot{height:125px;display:flex;align-items:center;justify-content:flex-end;flex-direction:column;position:relative;grid-column:span 2}.slot:nth-child(1){grid-column:3/5}.slot:nth-child(2){grid-column:1/3}.slot:nth-child(3){grid-column:3/5}.slot:nth-child(4){grid-column:2/4}.slot:nth-child(5){grid-column:4/6}.circle{width:88px;height:88px;border-radius:50%;background:#eee;border:3px solid #aaa;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.circle img{width:100%;height:100%;object-fit:cover}.empty{font-size:34px;color:#888}.number{position:absolute;bottom:-5px;left:calc(50% + 23px);background:#168cff;color:white;border-radius:50%;width:19px;height:19px;font-size:12px;display:grid;place-items:center;border:1px solid white}.person{font-size:12px;text-align:center;margin-top:5px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}.btn{border:1px solid #2698f4;color:#2698f4;background:#fff;padding:11px 14px;border-radius:4px;cursor:pointer;font-size:14px}.btn.primary{background:#39a4f5;color:white}.stamp{text-align:right;font-size:12px;margin:8px 4px 16px}.roster{border:1px solid #ddd;border-radius:4px;overflow:hidden}.searchbar{display:flex;gap:5px;padding:9px;background:#fafafa;border-bottom:1px solid #ddd}.searchbar input{flex:1;min-width:0;padding:9px;border:1px solid #ddd;border-radius:4px;font-size:14px}.personrow{display:flex;align-items:center;gap:15px;padding:9px 12px;border-bottom:1px solid #ddd;min-height:82px;cursor:grab}.personrow:last-child{border-bottom:0}.personrow:hover{background:#f7fbff}.avatar{width:62px;height:62px;border-radius:50%;border:3px solid #58a9ff;background:#eee;display:grid;place-items:center;overflow:hidden;flex:none;color:#888;font-size:24px}.avatar img{width:100%;height:100%;object-fit:cover}.details{min-width:0}.name{font-weight:700;font-size:14px}.sub{font-size:12px;color:#999;margin-top:5px}.upload{font-size:11px;color:#888;margin-top:4px}.upload input{max-width:190px;font-size:11px}.hint{text-align:center;color:#888;font-size:12px;margin:10px}.slot.filled .circle{border-color:#329eff}.slot.over .circle{outline:3px solid #9bd4ff}.foot{text-align:center;color:#aaa;font-size:11px;margin:20px 0}
@media(max-width:520px){main{padding:10px}.banner{height:62px}.podium{gap:12px 4px}.slot{height:112px}.circle{width:72px;height:72px}.person{font-size:10px;max-width:95px}.personrow{gap:10px;padding:8px}.avatar{width:54px;height:54px}.name{font-size:13px}}
</style></head><body><main>
<div class="banner">BIG5 TÜRKİYE <span>GIRLBAND RANKER</span></div>
<section class="podium" id="podium"></section>
<div class="stamp" id="stamp"></div>
<div class="actions"><button class="btn primary" id="download">↓ DOWNLOAD</button><button class="btn" id="copyurl">↗ URL</button><button class="btn" id="copy">▢ copy</button><button class="btn" id="clear">Reset</button></div>
<section class="roster"><div class="searchbar"><input id="search" placeholder="Search"><button class="btn" id="sort">A–Z</button></div><div style="display:flex;gap:6px;padding:9px;border-bottom:1px solid #ddd"><input id="newName" placeholder="Yeni yarışmacının adı" style="flex:1;min-width:0;padding:9px;border:1px solid #ddd;border-radius:4px"><button class="btn primary" id="addPerson">+ Ekle</button></div><div id="people"></div></section>
<p class="hint">Bir yarışmacıyı 1–5 numaralı alana sürükleyerek yerleştir. Yer değiştirmek için başka bir yarışmacıyı aynı alana bırak.</p>
<div class="foot">Fan yapımı Big5 Türkiye sıralama sayfası</div>
</main>
<script>
// Yarışmacı adlarını ve fotoğraflarını aşağıdaki listeden düzenleyebilirsin.
const defaultNames=['Aişe','Belinay','Beril','Cybelle','Daria','Ecenur','Esra','Eser','Ezgi','Fatime','Lal','Lara','Ödül','Tuğçe','Yağmur','Zeynep'];
const names=JSON.parse(localStorage.getItem('big5-five-names')||'null')||[...defaultNames];
const storage='big5-five-ranker-v1';let state=JSON.parse(localStorage.getItem(storage)||'{"slots":[null,null,null,null,null]}');let photos={};names.forEach(n=>photos[n]=localStorage.getItem('big5five-photo-'+n)||'');
const podium=document.getElementById('podium'),people=document.getElementById('people');
function persist(){localStorage.setItem(storage,JSON.stringify(state))}
function renderSlots(){podium.innerHTML='';state.slots.forEach((name,i)=>{let s=document.createElement('div');s.className='slot'+(name?' filled':'');s.dataset.slot=i;s.innerHTML=`<div class="circle">${name&&photos[name]?`<img src="${photos[name]}">`:`<span class="empty">♛</span>`}</div><span class="number">${i+1}</span><div class="person">${name||'Boş'}</div>`;s.addEventListener('dragover',e=>{e.preventDefault();s.classList.add('over')});s.addEventListener('dragleave',()=>s.classList.remove('over'));s.addEventListener('drop',e=>{e.preventDefault();s.classList.remove('over');let n=e.dataTransfer.getData('text/plain');if(!names.includes(n))return;state.slots=state.slots.map(x=>x===n?null:x);state.slots[i]=n;persist();renderSlots();renderPeople()});s.addEventListener('click',()=>{if(state.slots[i]){state.slots[i]=null;persist();renderSlots();renderPeople()}});podium.append(s)})}
function renderPeople(){let q=document.getElementById('search').value.toLocaleLowerCase('tr');people.innerHTML='';names.filter(n=>n.toLocaleLowerCase('tr').includes(q)).forEach(n=>{let row=document.createElement('div');row.className='personrow';row.draggable=true;row.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',n));let av=document.createElement('div');av.className='avatar';if(photos[n]){let im=document.createElement('img');im.src=photos[n];av.append(im)}else av.textContent=n[0];let d=document.createElement('div');d.className='details';let nm=document.createElement('div');nm.className='name';nm.textContent=n;let sub=document.createElement('div');sub.className='sub';sub.textContent='Big5 Türkiye';let up=document.createElement('div');up.className='upload';let inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.title=n+' fotoğrafı yükle';inp.addEventListener('click',e=>e.stopPropagation());inp.addEventListener('change',()=>{let f=inp.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{photos[n]=reader.result;localStorage.setItem('big5five-photo-'+n,reader.result);renderSlots();renderPeople()};reader.readAsDataURL(f)});up.append('Fotoğraf: ',inp);d.append(nm,sub,up);row.append(av,d);people.append(row)})}
document.getElementById('search').addEventListener('input',renderPeople);document.getElementById('addPerson').onclick=()=>{let input=document.getElementById('newName');let n=input.value.trim();if(!n){alert('Önce yarışmacının adını yaz.');return}if(names.some(x=>x.toLocaleLowerCase('tr')===n.toLocaleLowerCase('tr'))){alert('Bu isim zaten listede.');return}names.push(n);photos[n]='';localStorage.setItem('big5-five-names',JSON.stringify(names));input.value='';renderPeople()};document.getElementById('newName').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('addPerson').click()});document.getElementById('sort').onclick=()=>{names.sort((a,b)=>a.localeCompare(b,'tr'));localStorage.setItem('big5-five-names',JSON.stringify(names));renderPeople()};document.getElementById('clear').onclick=()=>{state.slots=[null,null,null,null,null];persist();renderSlots()};document.getElementById('copy').onclick=async()=>{let t=state.slots.map((n,i)=>`${i+1}. ${n||'—'}`).join('\n');try{await navigator.clipboard.writeText(t);alert('Sıralama kopyalandı')}catch{alert(t)}};document.getElementById('copyurl').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);alert('Sayfa adresi kopyalandı')}catch{alert(location.href)}};document.getElementById('download').onclick=()=>{let t=state.slots.map((n,i)=>`${i+1}. ${n||'—'}`).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));a.download='big5-siralamam.txt';a.click();URL.revokeObjectURL(a.href)};document.getElementById('stamp').textContent='at '+new Date().toLocaleString('tr-TR');renderSlots();renderPeople();
</script></body></html>
